    function ArchiveView({ data }) {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonthKey = getMonthKey(now);
      const [expandedMonths, setExpandedMonths] = useState({ [currentMonthKey]: true });

      const toggleMonth = (mk) => setExpandedMonths(prev => ({ ...prev, [mk]: !prev[mk] }));

      // Build a list of all months from earliest expense to current, with currentYear and 2 years back
      const earliestYear = currentYear - 2;
      const monthsList = [];
      for (let y = currentYear; y >= earliestYear; y--) {
        const maxMonth = y === currentYear ? now.getMonth() : 11;
        for (let m = maxMonth; m >= 0; m--) {
          monthsList.push(y + '-' + String(m + 1).padStart(2, '0'));
        }
      }

      // For each month, gather items
      const fixedItems = data.fixedExpenses;
      const installmentsList = data.installments;

      const buildMonthData = (mk) => {
        const [y, m] = mk.split('-').map(Number);
        const variableExp = data.expenses.filter(e => e.date.startsWith(mk));
        const incomes = (data.incomes || []).filter(i => i.date.startsWith(mk));
        const activeInst = installmentsList.filter(i => isInstallmentActiveInMonth(i, mk));

        const items = [];
        variableExp.forEach(e => items.push({ ...e, isVariable: true, sortDate: e.date }));
        fixedItems.forEach(f => items.push({ id: 'fix-' + f.id + '-' + mk, supplier: f.name, amount: f.amount, category: f.category, paymentMethod: f.paymentMethod || 'credit', date: mk + '-01', sortDate: mk + '-01', isFixed: true, note: f.note }));
        activeInst.forEach(i => items.push({ id: 'inst-' + i.id + '-' + mk, supplier: i.name, amount: i.amount, category: i.category, date: mk + '-01', sortDate: mk + '-01', isInstallment: true, installmentNumber: getInstallmentNumber(i, mk), totalPayments: i.totalPayments }));
        incomes.forEach(inc => items.push({ id: 'inc-' + inc.id, supplier: inc.description, amount: inc.amount, date: inc.date, sortDate: inc.date, isIncome: true }));

        items.sort((a, b) => b.sortDate.localeCompare(a.sortDate));

        const totalExp = variableExp.reduce((s, e) => s + Number(e.amount), 0)
          + fixedItems.reduce((s, f) => s + Number(f.amount), 0)
          + activeInst.reduce((s, i) => s + Number(i.amount), 0);
        const totalInc = incomes.reduce((s, i) => s + Number(i.amount), 0);
        const net = totalExp - totalInc;

        return { items, totalExp, totalInc, net, year: y, month: m, hasData: items.length > 0 };
      };

      // Filter months: show only those with data, or future months in current year (none in archive really)
      const monthsWithData = monthsList.map(mk => ({ mk, ...buildMonthData(mk) })).filter(x => x.hasData || x.mk === currentMonthKey);

      if (monthsWithData.length === 0) {
        return <p className="text-center text-slate-400 py-16">אין עדיין נתונים בארכיון</p>;
      }

      return (
        <div className="space-y-3">
          <p className="text-xs text-slate-500 text-center mb-2">{earliestYear} - {currentYear} · {monthsWithData.length} חודשים</p>
          {monthsWithData.map(monthData => {
            const isExpanded = !!expandedMonths[monthData.mk];
            const isCurrent = monthData.mk === currentMonthKey;
            return (
              <div key={monthData.mk} className="bg-white/80 backdrop-blur rounded-2xl shadow-sm border border-slate-200/50 overflow-hidden">
                <button onClick={() => toggleMonth(monthData.mk)} className="w-full flex items-center justify-between p-4 hover:bg-slate-50 transition-colors text-right">
                  <div className="flex items-center gap-2">
                    {isExpanded ? <ChevronDown className="w-4 h-4 text-slate-500" /> : <ChevronLeft className="w-4 h-4 text-slate-500" />}
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-slate-800">{hebrewMonths[monthData.month]} {monthData.year}</span>
                        {isCurrent && <span className="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full">החודש</span>}
                      </div>
                      <div className="text-xs text-slate-500">{monthData.items.length} פעולות</div>
                    </div>
                  </div>
                  <div className="text-left">
                    <div className="font-bold text-slate-800">{formatCurrency(monthData.totalExp)}</div>
                    {monthData.totalInc > 0 && (
                      <div className="text-[11px] text-emerald-700">+{formatCurrency(monthData.totalInc)}</div>
                    )}
                  </div>
                </button>
                {isExpanded && (
                  <div className="px-4 pb-4 pt-1 space-y-1.5 border-t border-slate-100">
                    {monthData.items.map(item => {
                      const d = new Date(item.date);
                      const dayMonth = `${d.getDate()}/${d.getMonth() + 1}`;
                      return (
                        <div key={item.id} className="flex items-center justify-between gap-2 py-1.5 text-sm">
                          <div className="flex items-center gap-2 min-w-0 flex-1">
                            <span className="text-[11px] text-slate-400 flex-shrink-0 w-9">{dayMonth}</span>
                            <span className={`truncate ${item.isIncome ? 'text-emerald-700' : 'text-slate-700'}`}>{item.supplier}</span>
                            {item.isFixed && <span className="text-[9px] bg-indigo-100 text-indigo-700 px-1 py-0.5 rounded-full flex-shrink-0">קבועה</span>}
                            {item.isInstallment && <span className="text-[9px] bg-purple-100 text-purple-700 px-1 py-0.5 rounded-full flex-shrink-0">{item.installmentNumber}/{item.totalPayments}</span>}
                            {item.isIncome && <span className="text-[9px] bg-emerald-100 text-emerald-700 px-1 py-0.5 rounded-full flex-shrink-0">הכנסה</span>}
                          </div>
                          <span className={`font-medium flex-shrink-0 ${item.isIncome ? 'text-emerald-700' : 'text-slate-800'}`}>
                            {item.isIncome ? '+' : ''}{formatCurrency(Number(item.amount))}
                          </span>
                        </div>
                      );
                    })}
                    <div className="flex items-center justify-between pt-2 mt-2 border-t border-slate-200 text-sm">
                      <span className="font-medium text-slate-700">סה״כ ב{hebrewMonths[monthData.month]}</span>
                      <div className="text-left">
                        <div className="font-bold text-slate-800">{formatCurrency(monthData.net)}</div>
                        {monthData.totalInc > 0 && (
                          <div className="text-[10px] text-slate-500">{formatCurrency(monthData.totalExp)} הוצאה · {formatCurrency(monthData.totalInc)} הכנסה</div>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function QuarterlyReport({ data }) {
      const now = new Date();
      const [selectedYear, setSelectedYear] = useState(now.getFullYear());
      const [selectedQuarter, setSelectedQuarter] = useState(getQuarter(now));

      const goPrev = () => { if (selectedQuarter === 1) { setSelectedYear(selectedYear - 1); setSelectedQuarter(4); } else { setSelectedQuarter(selectedQuarter - 1); } };
      const goNext = () => { if (selectedQuarter === 4) { setSelectedYear(selectedYear + 1); setSelectedQuarter(1); } else { setSelectedQuarter(selectedQuarter + 1); } };

      const startMonth = (selectedQuarter - 1) * 3;
      const monthKeys = [0, 1, 2].map(o => `${selectedYear}-${String(startMonth + o + 1).padStart(2, '0')}`);

      const variableInQuarter = data.expenses.filter(e => monthKeys.some(mk => e.date.startsWith(mk)));
      const monthsCount = monthKeys.filter(mk => { const [y, m] = mk.split('-').map(Number); return new Date(y, m - 1, 1) <= now; }).length;

      const categoryStats = {};
      variableInQuarter.forEach(e => {
        if (!categoryStats[e.category]) categoryStats[e.category] = { total: 0, count: 0 };
        categoryStats[e.category].total += Number(e.amount);
        categoryStats[e.category].count++;
      });
      data.fixedExpenses.forEach(f => {
        if (!categoryStats[f.category]) categoryStats[f.category] = { total: 0, count: 0 };
        categoryStats[f.category].total += Number(f.amount) * monthsCount;
        categoryStats[f.category].count += monthsCount;
      });
      monthKeys.forEach(mk => {
        data.installments.filter(i => isInstallmentActiveInMonth(i, mk)).forEach(i => {
          if (!categoryStats[i.category]) categoryStats[i.category] = { total: 0, count: 0 };
          categoryStats[i.category].total += Number(i.amount);
          categoryStats[i.category].count++;
        });
      });

      const sortedCategories = Object.entries(categoryStats).map(([name, s]) => ({ name, ...s })).sort((a, b) => b.total - a.total);
      const totalSpent = sortedCategories.reduce((s, c) => s + c.total, 0);
      const incomesInQuarter = (data.incomes || []).filter(i => monthKeys.some(mk => i.date.startsWith(mk)));
      const totalIncome = incomesInQuarter.reduce((s, i) => s + Number(i.amount), 0);
      const allNotes = variableInQuarter.filter(e => e.note).sort((a, b) => b.date.localeCompare(a.date));
      const isFuture = monthsCount === 0;

      return (
        <div className="bg-white/80 backdrop-blur rounded-3xl p-5 shadow-sm border border-slate-200/50">
          <div className="flex items-start justify-between mb-1 gap-2 flex-wrap">
            <div className="flex items-center gap-2">
              <Sparkles className="w-5 h-5 text-amber-500" />
              <h2 className="text-lg font-bold text-slate-800">דו״ח רבעוני</h2>
            </div>
            <div className="flex items-center gap-1 bg-slate-100 rounded-full p-1">
              <button onClick={goPrev} className="p-1 hover:bg-white rounded-full"><ChevronRight className="w-4 h-4 text-slate-600" /></button>
              <span className="text-xs font-medium text-slate-700 px-2 min-w-[80px] text-center">רבעון {selectedQuarter} · {selectedYear}</span>
              <button onClick={goNext} className="p-1 hover:bg-white rounded-full"><ChevronLeft className="w-4 h-4 text-slate-600" /></button>
            </div>
          </div>
          <p className="text-xs text-slate-500 mb-4">{hebrewMonths[startMonth]} - {hebrewMonths[startMonth + 2]}</p>

          {isFuture ? <p className="text-center text-slate-400 py-12">רבעון עתידי - עדיין אין נתונים</p>
            : sortedCategories.length === 0 && totalIncome === 0 ? <p className="text-center text-slate-400 py-12">אין הוצאות ברבעון הזה</p>
            : (
              <>
                <div className="bg-amber-50/60 border border-amber-200 rounded-2xl p-3 mb-4">
                  <p className="text-sm text-amber-900 font-medium mb-1">סקירה לשיפור הקטגוריות</p>
                  <p className="text-xs text-amber-800/90">עברי על הקטגוריות וההערות. האם יש קטגוריה גדולה מדי שכדאי לפצל? משהו שחוזר על עצמו ושווה לתת לו קטגוריה משלו? בסוף הסקירה תוכלי לעדכן ב״הגדרות״.</p>
                </div>
                <div className="mb-4 flex items-center justify-between text-sm px-1">
                  <span className="font-medium text-slate-700">סה״כ הוצאות ברבעון</span>
                  <span className="font-bold text-slate-800">{formatCurrency(totalSpent)}</span>
                </div>
                {totalIncome > 0 && (
                  <div className="mb-4 flex items-center justify-between text-sm px-1 -mt-2">
                    <span className="font-medium text-emerald-700 flex items-center gap-1.5">
                      <TrendingUp className="w-3.5 h-3.5" />
                      הכנסות ברבעון
                    </span>
                    <span className="font-bold text-emerald-700">+{formatCurrency(totalIncome)}</span>
                  </div>
                )}
                <div className="space-y-2 mb-4">
                  <p className="text-xs text-slate-500 font-medium px-1 mb-1">קטגוריות</p>
                  {sortedCategories.map((cat, i) => {
                    const percent = totalSpent > 0 ? (cat.total / totalSpent) * 100 : 0;
                    return (
                      <div key={cat.name} className="bg-slate-50 rounded-xl p-3">
                        <div className="flex items-center justify-between mb-1">
                          <div className="flex items-center gap-2">
                            <div className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: CHART_COLORS[i % CHART_COLORS.length] }} />
                            <span className="font-medium text-slate-800 text-sm">{cat.name}</span>
                            <span className="text-xs text-slate-500">· {cat.count} פריטים</span>
                          </div>
                          <span className="font-bold text-slate-800 text-sm">{formatCurrency(cat.total)}</span>
                        </div>
                        <div className="w-full h-1 bg-white rounded-full overflow-hidden">
                          <div className="h-full" style={{ width: `${percent}%`, backgroundColor: CHART_COLORS[i % CHART_COLORS.length] }} />
                        </div>
                      </div>
                    );
                  })}
                </div>
                {allNotes.length > 0 && (
                  <div>
                    <p className="text-xs text-slate-500 font-medium px-1 mb-2 flex items-center gap-1">
                      <MessageSquare className="w-3 h-3" />הערות מהרבעון ({allNotes.length})
                    </p>
                    <div className="space-y-2">
                      {allNotes.map((n, idx) => {
                        const d = new Date(n.date);
                        return (
                          <div key={idx} className="bg-blue-50/60 border border-blue-100 rounded-xl p-3">
                            <div className="flex items-center justify-between text-xs text-slate-500 mb-1">
                              <span>{n.supplier} · {n.category}</span>
                              <span>{d.getDate()}/{d.getMonth() + 1}</span>
                            </div>
                            <p className="text-sm text-slate-700 italic">{n.note}</p>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </>
            )}
        </div>
      );
    }

    function SettingsView({ data, save }) {
      const [budgetInput, setBudgetInput] = useState(String(data.budget));
      const [newCategory, setNewCategory] = useState('');
      const [showAddFixed, setShowAddFixed] = useState(false);
      const [showAddInstallment, setShowAddInstallment] = useState(false);
      const [fixedForm, setFixedForm] = useState({ name: '', amount: '', category: data.categories[0] || '', paymentMethod: 'credit', requiresConfirmation: false, shared: false, note: '' });
      const [installmentForm, setInstallmentForm] = useState({ name: '', amount: '', totalPayments: '', currentInstallment: '1', category: data.categories[0] || '', shared: false, note: '' });

      // ===== Backup state =====
      const [pendingImport, setPendingImport] = useState(null);
      const [importError, setImportError] = useState('');
      const [exportFlash, setExportFlash] = useState(false);

      const exportBackup = () => {
        try {
          const backup = {
            appName: 'kesef',
            version: 1,
            exportedAt: new Date().toISOString(),
            data: data,
          };
          const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const now = new Date();
          const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
          const a = document.createElement('a');
          a.href = url;
          a.download = `kesef-backup-${dateStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setExportFlash(true);
          setTimeout(() => setExportFlash(false), 2500);
        } catch (e) {
          console.error(e);
          alert('שגיאה ביצירת הגיבוי');
        }
      };

      const handleImportFileSelect = (e) => {
        const file = e.target.files?.[0];
        e.target.value = ''; // reset so same file can be picked again
        if (!file) return;
        setImportError('');
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            const inner = parsed?.data;
            if (!inner || typeof inner !== 'object') {
              throw new Error('הקובץ לא נראה כמו גיבוי תקין של האפליקציה');
            }
            const expensesCount = Array.isArray(inner.expenses) ? inner.expenses.length : 0;
            const fixedCount = Array.isArray(inner.fixedExpenses) ? inner.fixedExpenses.length : 0;
            const installmentsCount = Array.isArray(inner.installments) ? inner.installments.length : 0;
            const incomesCount = Array.isArray(inner.incomes) ? inner.incomes.length : 0;
            const plannedCount = Array.isArray(inner.plannedExpenses) ? inner.plannedExpenses.length : 0;
            const sharedCount = Array.isArray(inner.shared?.expenses) ? inner.shared.expenses.length : 0;
            setPendingImport({
              parsed,
              fileName: file.name,
              exportedAt: parsed.exportedAt,
              counts: { expenses: expensesCount, fixed: fixedCount, installments: installmentsCount, incomes: incomesCount, planned: plannedCount, shared: sharedCount },
            });
          } catch (err) {
            setImportError('הקובץ לא תקין: ' + (err?.message || 'שגיאה לא ידועה'));
          }
        };
        reader.onerror = () => setImportError('שגיאה בקריאת הקובץ');
        reader.readAsText(file);
      };

      const confirmImport = () => {
        if (!pendingImport) return;
        const imp = pendingImport.parsed.data;
        save({
          budget: typeof imp.budget === 'number' ? imp.budget : DEFAULT_BUDGET,
          categories: Array.isArray(imp.categories) ? imp.categories : DEFAULT_CATEGORIES,
          expenses: Array.isArray(imp.expenses) ? imp.expenses : [],
          fixedExpenses: Array.isArray(imp.fixedExpenses) ? imp.fixedExpenses : [],
          installments: Array.isArray(imp.installments) ? imp.installments : [],
          paidFixed: (imp.paidFixed && typeof imp.paidFixed === 'object') ? imp.paidFixed : {},
          incomes: Array.isArray(imp.incomes) ? imp.incomes : [],
          plannedExpenses: Array.isArray(imp.plannedExpenses) ? imp.plannedExpenses : [],
          shared: {
            annualBudget: typeof imp.shared?.annualBudget === 'number' ? imp.shared.annualBudget : DEFAULT_ANNUAL_BUDGET,
            categories: Array.isArray(imp.shared?.categories) ? imp.shared.categories : DEFAULT_SHARED_CATEGORIES,
            expenses: Array.isArray(imp.shared?.expenses) ? imp.shared.expenses : [],
          },
        });
        setPendingImport(null);
      };

      const cancelImport = () => setPendingImport(null);

      const formatExportDate = (iso) => {
        try {
          const d = new Date(iso);
          if (isNaN(d.getTime())) return null;
          const dd = String(d.getDate()).padStart(2, '0');
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const yyyy = d.getFullYear();
          const hh = String(d.getHours()).padStart(2, '0');
          const min = String(d.getMinutes()).padStart(2, '0');
          return `${dd}/${mm}/${yyyy} בשעה ${hh}:${min}`;
        } catch (e) { return null; }
      };

      const updateBudget = () => { const n = Number(budgetInput); if (n > 0) save({ ...data, budget: n }); };
      const addCategory = () => { const c = newCategory.trim(); if (c && !data.categories.includes(c)) { save({ ...data, categories: [...data.categories, c] }); setNewCategory(''); } };
      const removeCategory = (cat) => save({ ...data, categories: data.categories.filter(c => c !== cat) });

      const addFixed = () => {
        if (!fixedForm.name.trim() || !Number(fixedForm.amount)) return;
        save({ ...data, fixedExpenses: [...data.fixedExpenses, { id: Date.now().toString(), name: fixedForm.name.trim(), amount: Number(fixedForm.amount), category: fixedForm.category, paymentMethod: fixedForm.paymentMethod, requiresConfirmation: fixedForm.requiresConfirmation, shared: fixedForm.shared || undefined, note: fixedForm.note.trim() || undefined }] });
        setFixedForm({ name: '', amount: '', category: data.categories[0] || '', paymentMethod: 'credit', requiresConfirmation: false, shared: false, note: '' });
        setShowAddFixed(false);
      };
      const removeFixed = (id) => save({ ...data, fixedExpenses: data.fixedExpenses.filter(f => f.id !== id) });
      const toggleFixedShared = (id) => save({ ...data, fixedExpenses: data.fixedExpenses.map(f => f.id === id ? { ...f, shared: !f.shared } : f) });

      const addInstallment = () => {
        const total = Number(installmentForm.totalPayments);
        const current = Number(installmentForm.currentInstallment);
        if (!installmentForm.name.trim() || !Number(installmentForm.amount) || !total || !current || current > total) return;
        const start = new Date(); start.setDate(1); start.setMonth(start.getMonth() - (current - 1));
        save({ ...data, installments: [...data.installments, { id: Date.now().toString(), name: installmentForm.name.trim(), amount: Number(installmentForm.amount), totalPayments: total, startMonth: getMonthKey(start), category: installmentForm.category, shared: installmentForm.shared || undefined, note: installmentForm.note.trim() || undefined }] });
        setInstallmentForm({ name: '', amount: '', totalPayments: '', currentInstallment: '1', category: data.categories[0] || '', shared: false, note: '' });
        setShowAddInstallment(false);
      };
      const removeInstallment = (id) => save({ ...data, installments: data.installments.filter(i => i.id !== id) });
      const toggleInstallmentShared = (id) => save({ ...data, installments: data.installments.map(i => i.id === id ? { ...i, shared: !i.shared } : i) });

      const currentMonthKey = getMonthKey(new Date());

      return (
        <>
          <div className="text-center mb-6"><h1 className="text-3xl font-bold text-slate-800 mb-1">הגדרות</h1></div>

          <Section title="תקציב חודשי">
            <div className="relative">
              <input type="number" inputMode="decimal" value={budgetInput} onChange={(e) => setBudgetInput(e.target.value)} onBlur={updateBudget}
                className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 text-slate-800 pl-12" />
              <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">₪</span>
            </div>
          </Section>

          <Section title="הוצאות קבועות חודשיות">
            {data.fixedExpenses.length === 0 ? <p className="text-sm text-slate-400 py-3 text-center">לא הוגדרו הוצאות קבועות</p> : (
              <div className="space-y-2 mb-3">
                {data.fixedExpenses.map(f => (
                  <div key={f.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl">
                    <div className="min-w-0 flex-1">
                      <div className="font-medium text-slate-800 text-sm truncate">{f.name}</div>
                      <div className="text-xs text-slate-500 flex items-center gap-1.5 flex-wrap">
                        <span>{f.category}</span>
                        {f.requiresConfirmation && <span className="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full">דורש אישור</span>}
                        <button onClick={() => toggleFixedShared(f.id)} className={`text-[10px] px-1.5 py-0.5 rounded-full flex items-center gap-1 ${f.shared ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-200 text-slate-500 hover:bg-slate-300'}`}>
                          <Link2 className="w-2.5 h-2.5" />
                          {f.shared ? 'משותף' : 'לא משותף'}
                        </button>
                      </div>
                      {f.note && <div className="text-xs text-slate-500 italic mt-0.5">{f.note}</div>}
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <span className="font-bold text-slate-700">{formatCurrency(f.amount)}</span>
                      <button onClick={() => removeFixed(f.id)} className="text-slate-400 hover:text-rose-600 p-1"><Trash2 className="w-4 h-4" /></button>
                    </div>
                  </div>
                ))}
                <div className="flex items-center justify-between pt-2 border-t border-slate-200 px-1">
                  <span className="text-sm text-slate-600">סה״כ קבועות</span>
                  <span className="font-bold text-slate-800">{formatCurrency(data.fixedExpenses.reduce((s, f) => s + Number(f.amount), 0))}</span>
                </div>
              </div>
            )}
            {showAddFixed ? (
              <div className="space-y-2 bg-blue-50/40 p-3 rounded-xl border border-blue-100">
                <input type="text" value={fixedForm.name} onChange={(e) => setFixedForm({ ...fixedForm, name: e.target.value })} placeholder="שם (לדוגמה: ארנונה)"
                  className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-slate-800 text-sm" />
                <div className="relative">
                  <input type="number" inputMode="decimal" value={fixedForm.amount} onChange={(e) => setFixedForm({ ...fixedForm, amount: e.target.value })} placeholder="סכום"
                    className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-slate-800 text-sm pl-10" />
                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">₪</span>
                </div>
                <div className="relative">
                  <select value={fixedForm.category} onChange={(e) => setFixedForm({ ...fixedForm, category: e.target.value })}
                    className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-slate-800 text-sm pl-9"
                    style={{ fontFamily: "'Heebo', sans-serif" }}>
                    {data.categories.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <ChevronDown className="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => setFixedForm({ ...fixedForm, paymentMethod: 'credit' })}
                    className={`flex items-center justify-center gap-2 py-2 rounded-lg border text-xs ${fixedForm.paymentMethod === 'credit' ? 'bg-blue-50 border-blue-400 text-blue-700' : 'bg-white border-slate-200 text-slate-600'}`}>
                    <CreditCard className="w-3.5 h-3.5" />אשראי
                  </button>
                  <button onClick={() => setFixedForm({ ...fixedForm, paymentMethod: 'cash' })}
                    className={`flex items-center justify-center gap-2 py-2 rounded-lg border text-xs ${fixedForm.paymentMethod === 'cash' ? 'bg-blue-50 border-blue-400 text-blue-700' : 'bg-white border-slate-200 text-slate-600'}`}>
                    <Wallet className="w-3.5 h-3.5" />מזומן
                  </button>
                </div>
                <button onClick={() => setFixedForm({ ...fixedForm, requiresConfirmation: !fixedForm.requiresConfirmation })}
                  className={`w-full flex items-start gap-2.5 p-2.5 rounded-lg border text-right ${fixedForm.requiresConfirmation ? 'bg-amber-50 border-amber-300' : 'bg-white border-slate-200'}`}>
                  <div className={`flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center mt-0.5 ${fixedForm.requiresConfirmation ? 'bg-amber-500 border-amber-500' : 'bg-white border-slate-300'}`}>
                    {fixedForm.requiresConfirmation && <Check className="w-3 h-3 text-white" strokeWidth={3} />}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className={`text-sm font-medium ${fixedForm.requiresConfirmation ? 'text-amber-800' : 'text-slate-700'}`}>דורש אישור תשלום ידני</div>
                    <div className="text-[11px] text-slate-500">לא הוראת קבע - יופיע באפור עד שתסמני שולם</div>
                  </div>
                </button>
                <button onClick={() => setFixedForm({ ...fixedForm, shared: !fixedForm.shared })}
                  className={`w-full flex items-start gap-2.5 p-2.5 rounded-lg border text-right ${fixedForm.shared ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-slate-200'}`}>
                  <div className={`flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center mt-0.5 ${fixedForm.shared ? 'bg-indigo-600 border-indigo-600' : 'bg-white border-slate-300'}`}>
                    {fixedForm.shared && <Check className="w-3 h-3 text-white" strokeWidth={3} />}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className={`text-sm font-medium ${fixedForm.shared ? 'text-indigo-800' : 'text-slate-700'}`}>גם הוצאה משותפת</div>
                    <div className="text-[11px] text-slate-500">
                      {fixedForm.amount && Number(fixedForm.amount) > 0
                        ? `במשותף יופיע ${formatCurrency(Number(fixedForm.amount) * 2)} בכל חודש (כפול 2)`
                        : 'יופיע אוטומטית במרחב המשותף בכל חודש, עם סכום כפול'}
                    </div>
                  </div>
                </button>
                <textarea value={fixedForm.note} onChange={(e) => setFixedForm({ ...fixedForm, note: e.target.value })} placeholder="הערה (אופציונלי)" rows="2"
                  className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-slate-800 text-sm resize-none" />
                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button onClick={() => setShowAddFixed(false)} className="py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">ביטול</button>
                  <button onClick={addFixed} className="py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">הוסף</button>
                </div>
              </div>
            ) : (
              <button onClick={() => setShowAddFixed(true)} className="w-full py-2.5 border-2 border-dashed border-slate-300 hover:border-blue-400 hover:text-blue-600 text-slate-500 rounded-xl text-sm font-medium">+ הוסף הוצאה קבועה</button>
            )}
          </Section>

          <Section title="תשלומים פעילים">
            <p className="text-xs text-slate-500 mb-3">פריטים שאת משלמת ב-X תשלומים. תמיד אשראי. נעלמים אוטומטית בסוף.</p>
            {data.installments.length === 0 ? <p className="text-sm text-slate-400 py-3 text-center">אין תשלומים פעילים</p> : (
              <div className="space-y-2 mb-3">
                {data.installments.map(i => {
                  const cur = getInstallmentNumber(i, currentMonthKey);
                  const remaining = i.totalPayments - cur + 1;
                  const active = cur >= 1 && cur <= i.totalPayments;
                  return (
                    <div key={i.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl">
                      <div className="min-w-0 flex-1">
                        <div className="font-medium text-slate-800 text-sm truncate">{i.name}</div>
                        <div className="text-xs text-slate-500 flex items-center gap-1.5 flex-wrap">
                          <span>{i.category} · {active ? `תשלום ${cur}/${i.totalPayments} · נותרו ${remaining}` : cur > i.totalPayments ? 'הסתיים' : 'טרם התחיל'}</span>
                          <button onClick={() => toggleInstallmentShared(i.id)} className={`text-[10px] px-1.5 py-0.5 rounded-full flex items-center gap-1 ${i.shared ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-200 text-slate-500 hover:bg-slate-300'}`}>
                            <Link2 className="w-2.5 h-2.5" />
                            {i.shared ? 'משותף' : 'לא משותף'}
                          </button>
                        </div>
                        {i.note && <div className="text-xs text-slate-500 italic mt-0.5">{i.note}</div>}
                      </div>
                      <div className="flex items-center gap-2 flex-shrink-0">
                        <span className="font-bold text-slate-700">{formatCurrency(i.amount)}</span>
                        <button onClick={() => removeInstallment(i.id)} className="text-slate-400 hover:text-rose-600 p-1"><Trash2 className="w-4 h-4" /></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            {showAddInstallment ? (

    function SharedHomeView({ data, sharedData, displayedMonthKey, currentMonthKey, onPrevMonth, onNextMonth, onCurrentMonth, onEdit, onDelete }) {
      const isCurrent = displayedMonthKey === currentMonthKey;
      const [year, monthNum] = displayedMonthKey.split('-').map(Number);
      const monthName = hebrewMonths[monthNum - 1];

      // Swipe gesture handling
      const touchStart = React.useRef(null);
      const handleTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
      const handleTouchEnd = (e) => {
        if (touchStart.current === null) return;
        const diff = e.changedTouches[0].clientX - touchStart.current;
        if (Math.abs(diff) > 60) {
          if (diff > 0) onNextMonth(); else onPrevMonth();
        }
        touchStart.current = null;
      };

      const allItems = computeAllSharedItems(data);

      // Year-to-date calculation
      const yearStr = String(year);
      const yearItems = allItems.filter(e => e.date.startsWith(yearStr));
      const yearTotal = yearItems.reduce((s, e) => s + Number(e.amount), 0);
      const yearRemaining = sharedData.annualBudget - yearTotal;
      const progressPercent = Math.min((yearTotal / sharedData.annualBudget) * 100, 100);

      // Displayed month items
      const monthItems = allItems
        .filter(e => e.date.startsWith(displayedMonthKey))
        .sort((a, b) => b.date.localeCompare(a.date));
      const monthTotal = monthItems.reduce((s, e) => s + Number(e.amount), 0);

      const balancePositive = yearRemaining >= 0;
      const isPast = displayedMonthKey < currentMonthKey;

      return (
        <>
          <div className="text-center mb-4">
            <h1 className="text-3xl font-bold text-slate-800 mb-2">מרחב משותף</h1>
            <div className="inline-flex items-center gap-1 bg-white/60 backdrop-blur rounded-full px-1 py-1 border border-slate-200/50">
              <button onClick={onPrevMonth} className="p-1.5 hover:bg-slate-100 rounded-full text-slate-600" aria-label="חודש קודם"><ChevronRight className="w-4 h-4" /></button>
              <span className="text-sm font-medium text-slate-700 min-w-[110px] text-center">{monthName} {year}</span>
              <button onClick={onNextMonth} className="p-1.5 hover:bg-slate-100 rounded-full text-slate-600" aria-label="חודש הבא"><ChevronLeft className="w-4 h-4" /></button>
            </div>
            {!isCurrent && (
              <div className="mt-2">
                <button onClick={onCurrentMonth} className="text-xs text-indigo-600 hover:text-indigo-800 font-medium">חזרה לחודש הנוכחי ←</button>
              </div>
            )}
          </div>

          <div onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
            <div className="rounded-3xl p-6 text-white shadow-xl mb-6" style={{ background: isPast ? 'linear-gradient(135deg, #64748b 0%, #475569 100%)' : 'linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%)' }}>
              <p className="text-sm mb-1 opacity-80">הוצאתם ב{monthName}</p>
              <div className="text-4xl font-bold mb-4">{formatCurrency(monthTotal)}</div>

              <div className="space-y-1 text-xs opacity-85 mb-3 pt-3 border-t border-white/20">
                <div className="flex items-center justify-between">
                  <span>הוצאות מצטברות {year}</span>
                  <span className="font-medium">{formatCurrency(yearTotal)}</span>
                </div>
                <div className="flex items-center justify-between">
                  <span>נשאר מהתקציב השנתי</span>
                  <span className={`font-bold ${balancePositive ? '' : 'text-rose-200'}`}>{formatCurrency(yearRemaining)}</span>
                </div>
              </div>
              <div className="w-full h-2 bg-black/20 rounded-full overflow-hidden">
                <div className={`h-full transition-all ${balancePositive ? 'bg-white' : 'bg-rose-300'}`} style={{ width: `${progressPercent}%` }} />
              </div>
              <div className="text-[10px] opacity-70 mt-1 text-center">{Math.round(progressPercent)}% מהתקציב השנתי של {formatCurrency(sharedData.annualBudget)}</div>
            </div>

            <div className="bg-white/80 backdrop-blur rounded-3xl p-5 shadow-sm border border-slate-200/50">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-lg font-bold text-slate-800">הוצאות {isCurrent ? 'החודש' : `ב${monthName}`}</h2>
                <span className="text-xs text-slate-500">{monthItems.length} פעולות</span>
              </div>
              {monthItems.length === 0 ? (
                <p className="text-center text-slate-400 py-8">אין הוצאות בחודש זה</p>
              ) : (
                <div className="space-y-2">
                  {monthItems.map(exp => (
                    <SharedExpenseRow key={exp.id} expense={exp}
                      onEdit={exp.sourceType === 'independent' ? () => onEdit({ id: exp.linkedId, supplier: exp.supplier, amount: exp.amount, category: exp.category, date: exp.date, note: exp.note }) : null}
                      onDelete={exp.sourceType === 'independent' ? () => onDelete(exp.linkedId) : null} />
                  ))}
                </div>
              )}
            </div>
          </div>
        </>
      );
    }

    function SharedExpenseRow({ expense, onEdit, onDelete }) {
      const date = new Date(expense.date);
      const dayMonth = `${date.getDate()}/${date.getMonth() + 1}`;
      const isLinked = expense.sourceType && expense.sourceType !== 'independent';
      const sourceLabel = expense.sourceType === 'linked-fixed' ? 'מקושר · קבועה'
        : expense.sourceType === 'linked-installment' ? 'מקושר · תשלומים'
        : expense.sourceType === 'linked-expense' ? 'מקושר · אישי'
        : null;

      return (
        <div className={`flex items-center gap-3 p-3 rounded-xl transition-colors group ${isLinked ? 'bg-violet-50/40 hover:bg-violet-50 border border-violet-100/60 border-dashed' : 'bg-indigo-50/40 hover:bg-indigo-50 border border-indigo-100/50'}`}>
          <div className={`p-2 rounded-full ${isLinked ? 'bg-violet-100 text-violet-600' : 'bg-indigo-100 text-indigo-600'}`}>
            {isLinked ? <Link2 className="w-4 h-4" /> : <Users className="w-4 h-4" />}

          <div className="flex-1 min-w-0">
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 min-w-0 flex-wrap">
                <span className="font-medium text-slate-800 truncate">{expense.supplier}</span>
                {sourceLabel && <span className="text-[10px] bg-violet-100 text-violet-700 px-1.5 py-0.5 rounded-full flex-shrink-0">{sourceLabel}</span>}
              </div>
              <span className="font-bold text-slate-700 flex-shrink-0">{formatCurrency(Number(expense.amount))}</span>
            </div>
            <div className="flex items-center justify-between text-xs text-slate-500">
              <span>{expense.category || 'ללא קטגוריה'} · {dayMonth}</span>
              {!isLinked && (onEdit || onDelete) && (
                <div className="flex items-center gap-1 opacity-60 group-hover:opacity-100 transition-opacity">
                  {onEdit && <button onClick={(e) => { e.stopPropagation(); onEdit(); }} className="text-slate-400 hover:text-indigo-600 p-1"><Edit2 className="w-3.5 h-3.5" /></button>}
                  {onDelete && <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="text-slate-400 hover:text-rose-600 p-1"><Trash2 className="w-3.5 h-3.5" /></button>}
                </div>
              )}
              {isLinked && <span className="text-[10px] text-violet-600/80 italic">לעריכה - באישי</span>}
            </div>
            {expense.note && (
              <div className="flex items-start gap-1 mt-1 text-xs text-slate-500 italic">
                <MessageSquare className="w-3 h-3 flex-shrink-0 mt-0.5 opacity-60" />
                <span className="break-words">{expense.note}</span>
              </div>
            )}
          </div>
        </div>
      );
    }

      const [budgetInput, setBudgetInput] = useState(String(sharedData.annualBudget));
      const [newCategory, setNewCategory] = useState('');

      const updateBudget = () => { const n = Number(budgetInput); if (n > 0) onUpdateBudget(n); };
      const handleAddCategory = () => { const c = newCategory.trim(); if (c) { onAddCategory(c); setNewCategory(''); } };

      return (
        <>
          <div className="text-center mb-6"><h1 className="text-3xl font-bold text-slate-800 mb-1">הגדרות משותף</h1></div>

          <Section title="תקציב שנתי">
            <div className="relative">
              <input type="number" inputMode="decimal" value={budgetInput} onChange={(e) => setBudgetInput(e.target.value)} onBlur={updateBudget}
                className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800 pl-12" />
              <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">₪</span>
            </div>
            <p className="text-xs text-slate-500 mt-2">התקציב מתחיל בינואר ומסתיים בדצמבר</p>
          </Section>

          <Section title="קטגוריות">
            <div className="flex flex-wrap gap-2 mb-3">
              {sharedData.categories.map(cat => (
                <div key={cat} className="flex items-center gap-1 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full text-sm">
                  <span>{cat}</span>
                  <button onClick={() => onRemoveCategory(cat)} className="hover:text-rose-600 ms-0.5"><X className="w-3 h-3" /></button>
                </div>
              ))}
            </div>
            <div className="flex items-center gap-2">
              <input type="text" value={newCategory} onChange={(e) => setNewCategory(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAddCategory()} placeholder="קטגוריה חדשה"
                className="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800 text-sm" />
              <button onClick={handleAddCategory} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">הוסף</button>
            </div>
            <p className="text-xs text-slate-500 mt-3">הקטגוריות כאן נפרדות מהמרחב האישי</p>
          </Section>
        </>
      );
    }

    function SharedStatsView({ data, sharedData }) {
      const [subTab, setSubTab] = useState('stats');
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonthKey = getMonthKey(now);

      const allItems = computeAllSharedItems(data);
      const currentYearItems = allItems.filter(e => e.date.startsWith(String(currentYear)));
      const yearTotal = currentYearItems.reduce((s, e) => s + Number(e.amount), 0);

      // Category breakdown for current year
      const categoryTotals = {};
      currentYearItems.forEach(e => {
        const c = e.category || 'ללא קטגוריה';
        categoryTotals[c] = (categoryTotals[c] || 0) + Number(e.amount);
      });
      const pieData = Object.entries(categoryTotals).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);

      // Monthly breakdown for current year
      const monthlyData = [];
      for (let m = 0; m < 12; m++) {
        const mk = currentYear + '-' + String(m + 1).padStart(2, '0');
        const monthExp = allItems.filter(e => e.date.startsWith(mk)).reduce((s, e) => s + Number(e.amount), 0);
        monthlyData.push({ month: hebrewMonthsShort[m], expenses: Math.round(monthExp) });
      }

      return (
        <>
          <div className="text-center mb-6">
            <h1 className="text-3xl font-bold text-slate-800 mb-1">נתונים</h1>
            <p className="text-sm text-slate-500">משותף · {currentYear}</p>
          </div>

          <div className="grid grid-cols-2 gap-1 bg-slate-100 rounded-2xl p-1 mb-5">
            <button onClick={() => setSubTab('stats')}
              className={`flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-sm font-medium transition-all ${subTab === 'stats' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>
              <BarChart3 className="w-4 h-4" />
              סטטיסטיקה
            </button>
            <button onClick={() => setSubTab('archive')}
              className={`flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-sm font-medium transition-all ${subTab === 'archive' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>
              <Calendar className="w-4 h-4" />
              ארכיון
            </button>
          </div>

          {subTab === 'archive' ? <SharedArchiveView data={data} sharedData={sharedData} />
          : (<>
            <div className="rounded-3xl p-5 text-white shadow-sm mb-4" style={{ background: 'linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%)' }}>
              <p className="text-sm opacity-80 mb-1">סך הוצאות {currentYear}</p>
              <div className="text-3xl font-bold mb-1">{formatCurrency(yearTotal)}</div>
              <div className="text-xs opacity-85">מתוך תקציב שנתי של {formatCurrency(sharedData.annualBudget)}</div>
            </div>

            <div className="bg-white/80 backdrop-blur rounded-3xl p-5 shadow-sm border border-slate-200/50 mb-4">
              <h2 className="text-lg font-bold text-slate-800 mb-3">חלוקה לקטגוריות</h2>
              {pieData.length === 0 ? <p className="text-center text-slate-400 py-12">אין עדיין הוצאות השנה</p> : (
                <>
                  <div className="h-64">
                    <ResponsiveContainer width="100%" height="100%">
                      <PieChart>
                        <Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={90} paddingAngle={2} dataKey="value">
                          {pieData.map((_, i) => <Cell key={i} fill={CHART_COLORS[i % CHART_COLORS.length]} />)}
                        </Pie>
                        <Tooltip formatter={(v) => formatCurrency(v)} contentStyle={{ fontFamily: "'Heebo', sans-serif", borderRadius: '12px', border: '1px solid #e2e8f0' }} />
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                  <div className="space-y-1.5 mt-2">
                    {pieData.map((cat, i) => (
                      <div key={cat.name} className="flex items-center justify-between text-sm">
                        <div className="flex items-center gap-2">
                          <div className="w-3 h-3 rounded-full" style={{ backgroundColor: CHART_COLORS[i % CHART_COLORS.length] }} />
                          <span className="text-slate-700">{cat.name}</span>
                        </div>
                        <span className="font-bold text-slate-800">{formatCurrency(cat.value)}</span>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>

            <div className="bg-white/80 backdrop-blur rounded-3xl p-5 shadow-sm border border-slate-200/50">
              <h2 className="text-lg font-bold text-slate-800 mb-3">חלוקה חודשית</h2>
              <div className="h-64">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={monthlyData} margin={{ top: 5, right: 5, left: 5, bottom: 5 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                    <XAxis dataKey="month" tick={{ fontSize: 11, fill: '#64748b', fontFamily: "'Heebo', sans-serif" }} />
                    <YAxis tick={{ fontSize: 11, fill: '#64748b', fontFamily: "'Heebo', sans-serif" }} />
                    <Tooltip formatter={(v) => formatCurrency(v)} contentStyle={{ fontFamily: "'Heebo', sans-serif", borderRadius: '12px', border: '1px solid #e2e8f0' }} />
                    <Bar dataKey="expenses" fill="#4f46e5" radius={[6, 6, 0, 0]} />
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>
          </>)}
        </>
      );
    }

    function SharedArchiveView({ data, sharedData }) {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonthKey = getMonthKey(now);
      const [expandedMonths, setExpandedMonths] = useState({ [currentMonthKey]: true });
      const [selectedYear, setSelectedYear] = useState(currentYear);

      const toggleMonth = (mk) => setExpandedMonths(prev => ({ ...prev, [mk]: !prev[mk] }));

      const allItems = computeAllSharedItems(data);

      // Show selected year
      const yearMonths = [];
      const maxMonth = selectedYear === currentYear ? now.getMonth() : 11;
      for (let m = maxMonth; m >= 0; m--) {
        yearMonths.push(selectedYear + '-' + String(m + 1).padStart(2, '0'));
      }

      const buildMonthData = (mk) => {
        const [y, m] = mk.split('-').map(Number);
        const monthExp = allItems.filter(e => e.date.startsWith(mk)).sort((a, b) => b.date.localeCompare(a.date));
        const total = monthExp.reduce((s, e) => s + Number(e.amount), 0);
        return { items: monthExp, total, year: y, month: m, hasData: monthExp.length > 0 };
      };

      const monthsData = yearMonths.map(mk => ({ mk, ...buildMonthData(mk) }));
      const monthsWithData = monthsData.filter(x => x.hasData || x.mk === currentMonthKey);

      // Cumulative: sum from January up through this month
      const cumulativeForMonth = (mk) => {
        const [y, m] = mk.split('-').map(Number);
        let sum = 0;
        for (let mm = 1; mm <= m; mm++) {
          const monthKey = y + '-' + String(mm).padStart(2, '0');
          sum += allItems.filter(e => e.date.startsWith(monthKey)).reduce((s, e) => s + Number(e.amount), 0);
        }
        return sum;
      };

      const yearOptions = [currentYear, currentYear - 1, currentYear - 2];

      return (
        <div className="space-y-3">
          <div className="flex justify-center mb-3">
            <div className="inline-flex items-center gap-1 bg-slate-100 rounded-full p-1">
              {yearOptions.map(y => (
                <button key={y} onClick={() => setSelectedYear(y)}
                  className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all ${selectedYear === y ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>
                  {y}
                </button>
              ))}
            </div>
          </div>

          {monthsWithData.length === 0 ? (
            <p className="text-center text-slate-400 py-16">אין נתונים ל{selectedYear}</p>
          ) : (
            monthsWithData.map(monthData => {
              const isExpanded = !!expandedMonths[monthData.mk];
              const isCurrent = monthData.mk === currentMonthKey;
              const cumulative = cumulativeForMonth(monthData.mk);
              const remaining = sharedData.annualBudget - cumulative;
              return (
                <div key={monthData.mk} className="bg-white/80 backdrop-blur rounded-2xl shadow-sm border border-slate-200/50 overflow-hidden">
                  <button onClick={() => toggleMonth(monthData.mk)} className="w-full flex items-center justify-between p-4 hover:bg-slate-50 transition-colors text-right">
                    <div className="flex items-center gap-2">
                      {isExpanded ? <ChevronDown className="w-4 h-4 text-slate-500" /> : <ChevronLeft className="w-4 h-4 text-slate-500" />}
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-800">{hebrewMonths[monthData.month]} {monthData.year}</span>
                          {isCurrent && <span className="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-full">החודש</span>}
                        </div>
                        <div className="text-xs text-slate-500">{monthData.items.length} פעולות</div>
                      </div>
                    </div>
                    <div className="text-left">
                      <div className="font-bold text-slate-800">{formatCurrency(monthData.total)}</div>
                    </div>
                  </button>
                  {isExpanded && (
                    <div className="px-4 pb-4 pt-1 border-t border-slate-100">
                      <div className="space-y-1.5">
                        {monthData.items.map(item => {
                          const d = new Date(item.date);
                          const dayMonth = `${d.getDate()}/${d.getMonth() + 1}`;
                          return (
                            <div key={item.id} className="flex items-center justify-between gap-2 py-1.5 text-sm">
                              <div className="flex items-center gap-2 min-w-0 flex-1">
                                <span className="text-[11px] text-slate-400 flex-shrink-0 w-9">{dayMonth}</span>
                                <span className="truncate text-slate-700">{item.supplier}</span>
                                {item.category && <span className="text-[9px] bg-indigo-100 text-indigo-700 px-1 py-0.5 rounded-full flex-shrink-0">{item.category}</span>}
                              </div>
                              <span className="font-medium flex-shrink-0 text-slate-800">{formatCurrency(Number(item.amount))}</span>
                            </div>
                          );
                        })}
                      </div>
                      <div className="pt-2 mt-2 border-t border-slate-200 space-y-1">
                        <div className="flex items-center justify-between text-sm">
                          <span className="font-medium text-slate-700">סה״כ ב{hebrewMonths[monthData.month]}</span>
                          <span className="font-bold text-slate-800">{formatCurrency(monthData.total)}</span>
                        </div>
                        <div className="flex items-center justify-between text-xs text-slate-500">
                          <span>סה״כ מצטבר {monthData.year}</span>
                          <span className="font-medium">{formatCurrency(cumulative)}</span>
                        </div>
                        <div className="flex items-center justify-between text-xs">
                          <span className="text-slate-500">נשאר מהתקציב השנתי</span>
                          <span className={`font-bold ${remaining >= 0 ? 'text-indigo-700' : 'text-rose-600'}`}>{formatCurrency(remaining)}</span>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })
          )}
        </div>
      );
    }

    function Section({ title, children }) {
      return (
        <div className="bg-white/80 backdrop-blur rounded-3xl p-5 shadow-sm border border-slate-200/50 mb-4">
          <h2 className="text-lg font-bold text-slate-800 mb-3">{title}</h2>
          {children}
        </div>
      );
    }

    // ===== Render =====
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FinanceTracker />);
  </script>
</body>
</html>
