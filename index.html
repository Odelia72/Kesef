<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>מעקב הוצאות</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='72' font-family='sans-serif' font-size='62' font-weight='bold' fill='white' text-anchor='middle'>%E2%82%AA</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%232563eb'/><text x='50' y='72' font-family='sans-serif' font-size='62' font-weight='bold' fill='white' text-anchor='middle'>%E2%82%AA</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap">

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts/umd/Recharts.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(135deg, #EFF6FF 0%, #E0E7FF 50%, #DBEAFE 100%);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    #root { min-height: 100vh; }
    .initial-loader {
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #2563eb; font-family: 'Heebo', sans-serif;
    }
    /* Better dropdown rendering on mobile */
    select { -webkit-appearance: none; appearance: none; }
  </style>
</head>
<body>
  <div id="root">
    <div class="initial-loader">טוען...</div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip, BarChart, Bar, XAxis, YAxis, CartesianGrid } = Recharts;

    // ===== Inline SVG Icons (replacement for lucide-react) =====
    const Icon = ({ className = "w-5 h-5", strokeWidth = 2, children, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {children}
      </svg>
    );
    const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
    const Home = (p) => <Icon {...p}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>;
    const BarChart3 = (p) => <Icon {...p}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></Icon>;
    const Settings = (p) => <Icon {...p} strokeWidth={1.7}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;
    const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Icon>;
    const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
    const Edit2 = (p) => <Icon {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></Icon>;
    const CreditCard = (p) => <Icon {...p}><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></Icon>;
    const Wallet = (p) => <Icon {...p}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></Icon>;
    const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9"/></Icon>;
    const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"/></Icon>;
    const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6"/></Icon>;
    const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
    const Circle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/></Icon>;
    const Repeat = (p) => <Icon {...p}><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></Icon>;
    const Sparkles = (p) => <Icon {...p}><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 17v4"/><path d="M17 19h4"/></Icon>;
    const MessageSquare = (p) => <Icon {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></Icon>;
    const Download = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Icon>;
    const Upload = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></Icon>;
    const AlertTriangle = (p) => <Icon {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>;
    const Gift = (p) => <Icon {...p}><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></Icon>;
    const TrendingUp = (p) => <Icon {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>;
    const Calendar = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Icon>;
    const Users = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
    const User = (p) => <Icon {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;
    const Link2 = (p) => <Icon {...p}><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></Icon>;

    // ===== Constants =====
    const DEFAULT_CATEGORIES = ['אוכל', 'תרופות', 'ביטוחים', 'דלק ותחבורה', 'חשבונות', 'בילויים', 'ביגוד', 'בית', 'מתנות', 'אחר'];
    const DEFAULT_SHARED_CATEGORIES = ['רהיטים', 'חשבונות בית', 'אוכל לבית', 'חופשות', 'אחר'];
    const DEFAULT_BUDGET = 7200;
    const DEFAULT_ANNUAL_BUDGET = 30000;
    const STORAGE_KEY = 'finance-tracker-v1';

    const hebrewMonths = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
    const hebrewMonthsShort = ['ינו', 'פבר', 'מרץ', 'אפר', 'מאי', 'יונ', 'יול', 'אוג', 'ספט', 'אוק', 'נוב', 'דצמ'];

    const formatDate = (d) => {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };
    const formatCurrency = (n) => `₪${Math.round(n).toLocaleString('he-IL')}`;
    const getMonthKey = (date) => date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
    const getInstallmentNumber = (i, mk) => {
      const [sy, sm] = i.startMonth.split('-').map(Number);
      const [my, mm] = mk.split('-').map(Number);
      return (my - sy) * 12 + (mm - sm) + 1;
    };
    const isInstallmentActiveInMonth = (i, mk) => {
      const n = getInstallmentNumber(i, mk);
      return n >= 1 && n <= i.totalPayments;
    };
    const getQuarter = (d) => Math.floor(d.getMonth() / 3) + 1;

    // Computes the unified list of items visible in shared space:
    // independent records + linked from personal (expense×2, fixed×2 per month, installment total×2 on start month)
    const computeAllSharedItems = (data) => {
      const items = [];
      const shared = data.shared || { expenses: [] };

      (shared.expenses || []).forEach(e => items.push({
        id: 'sh-' + e.id, sourceType: 'independent', linkedId: e.id,
        supplier: e.supplier, amount: Number(e.amount),
        category: e.category, date: e.date, note: e.note,
      }));

      (data.expenses || []).filter(e => e.shared).forEach(e => items.push({
        id: 'shl-exp-' + e.id, sourceType: 'linked-expense', linkedId: e.id,
        supplier: e.supplier, amount: Number(e.amount) * 2,
        category: e.category, date: e.date, note: e.note,
      }));

      // Fixed expenses with shared toggle - appear every month of current year
      const currentYear = new Date().getFullYear();
      (data.fixedExpenses || []).filter(f => f.shared).forEach(f => {
        for (let m = 0; m < 12; m++) {
          const mk = currentYear + '-' + String(m + 1).padStart(2, '0');
          items.push({
            id: 'shl-fix-' + f.id + '-' + mk, sourceType: 'linked-fixed', linkedId: f.id,
            supplier: f.name, amount: Number(f.amount) * 2,
            category: f.category, date: mk + '-01', note: f.note,
          });
        }
      });

      // Installments with shared toggle - one entry of total × 2 on start month
      (data.installments || []).filter(i => i.shared).forEach(i => {
        items.push({
          id: 'shl-inst-' + i.id, sourceType: 'linked-installment', linkedId: i.id,
          supplier: i.name + ' (סה״כ ' + i.totalPayments + ' תשלומים)',
          amount: Number(i.amount) * i.totalPayments * 2,
          category: i.category, date: i.startMonth + '-01', note: i.note,
        });
      });

      return items;
    };

    const CHART_COLORS = ['#2563eb', '#0891b2', '#7c3aed', '#db2777', '#ea580c', '#059669', '#dc2626', '#4f46e5', '#0d9488', '#9333ea'];

    // ===== Main App =====
    function FinanceTracker() {
      const [loaded, setLoaded] = useState(false);
      const [space, setSpace] = useState('personal');
      const [view, setView] = useState('home');
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingExpense, setEditingExpense] = useState(null);
      const [editingIncome, setEditingIncome] = useState(null);
      const [editingPlanned, setEditingPlanned] = useState(null);
      const [editingSharedExpense, setEditingSharedExpense] = useState(null);
      const [confirmingPlanned, setConfirmingPlanned] = useState(null);
      const [displayedMonthKey, setDisplayedMonthKey] = useState(getMonthKey(new Date()));
      const [data, setData] = useState({
        budget: DEFAULT_BUDGET, categories: DEFAULT_CATEGORIES,
        expenses: [], fixedExpenses: [], installments: [], paidFixed: {},
        incomes: [], plannedExpenses: [],
        shared: { annualBudget: DEFAULT_ANNUAL_BUDGET, categories: DEFAULT_SHARED_CATEGORIES, expenses: [] },
      });

      useEffect(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            setData({
              budget: parsed.budget ?? DEFAULT_BUDGET,
              categories: parsed.categories ?? DEFAULT_CATEGORIES,
              expenses: parsed.expenses ?? [],
              fixedExpenses: parsed.fixedExpenses ?? [],
              installments: parsed.installments ?? [],
              paidFixed: parsed.paidFixed ?? {},
              incomes: parsed.incomes ?? [],
              plannedExpenses: parsed.plannedExpenses ?? [],
              shared: {
                annualBudget: parsed.shared?.annualBudget ?? DEFAULT_ANNUAL_BUDGET,
                categories: parsed.shared?.categories ?? DEFAULT_SHARED_CATEGORIES,
                expenses: parsed.shared?.expenses ?? [],
              },
            });
          }
        } catch (e) { console.error(e); }
        setLoaded(true);
      }, []);

      const save = (newData) => {
        setData(newData);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newData)); }
        catch (e) { console.error(e); }
      };

      const addExpense = (exp) => save({ ...data, expenses: [...data.expenses, { id: Date.now().toString() + Math.random(), ...exp }] });
      const updateExpense = (id, updates) => save({ ...data, expenses: data.expenses.map(e => e.id === id ? { ...e, ...updates } : e) });
      const deleteExpense = (id) => save({ ...data, expenses: data.expenses.filter(e => e.id !== id) });
      const addIncome = (inc) => save({ ...data, incomes: [...(data.incomes || []), { id: Date.now().toString() + Math.random(), ...inc }] });
      const updateIncome = (id, updates) => save({ ...data, incomes: (data.incomes || []).map(i => i.id === id ? { ...i, ...updates } : i) });
      const deleteIncome = (id) => save({ ...data, incomes: (data.incomes || []).filter(i => i.id !== id) });
      const addPlanned = (p) => save({ ...data, plannedExpenses: [...(data.plannedExpenses || []), { id: Date.now().toString() + Math.random(), ...p }] });
      const updatePlanned = (id, updates) => save({ ...data, plannedExpenses: (data.plannedExpenses || []).map(p => p.id === id ? { ...p, ...updates } : p) });
      const deletePlanned = (id) => save({ ...data, plannedExpenses: (data.plannedExpenses || []).filter(p => p.id !== id) });
      const addSharedExpense = (exp) => {
        const shared = data.shared || { annualBudget: DEFAULT_ANNUAL_BUDGET, categories: DEFAULT_SHARED_CATEGORIES, expenses: [] };
        save({ ...data, shared: { ...shared, expenses: [...shared.expenses, { id: Date.now().toString() + Math.random(), ...exp }] } });
      };
      const updateSharedExpense = (id, updates) => {
        const shared = data.shared || { annualBudget: DEFAULT_ANNUAL_BUDGET, categories: DEFAULT_SHARED_CATEGORIES, expenses: [] };
        save({ ...data, shared: { ...shared, expenses: shared.expenses.map(e => e.id === id ? { ...e, ...updates } : e) } });
      };
      const deleteSharedExpense = (id) => {
        const shared = data.shared || { annualBudget: DEFAULT_ANNUAL_BUDGET, categories: DEFAULT_SHARED_CATEGORIES, expenses: [] };
        save({ ...data, shared: { ...shared, expenses: shared.expenses.filter(e => e.id !== id) } });
      };
      const updateSharedBudget = (newBudget) => {
        const shared = data.shared || { annualBudget: DEFAULT_ANNUAL_BUDGET, categories: DEFAULT_SHARED_CATEGORIES, expenses: [] };
        save({ ...data, shared: { ...shared, annualBudget: newBudget } });
      };
      const addSharedCategory = (cat) => {
        const shared = data.shared || { annualBudget: DEFAULT_ANNUAL_BUDGET, categories: DEFAULT_SHARED_CATEGORIES, expenses: [] };
        if (cat && !shared.categories.includes(cat)) save({ ...data, shared: { ...shared, categories: [...shared.categories, cat] } });
      };
      const removeSharedCategory = (cat) => {
        const shared = data.shared || { annualBudget: DEFAULT_ANNUAL_BUDGET, categories: DEFAULT_SHARED_CATEGORIES, expenses: [] };
        save({ ...data, shared: { ...shared, categories: shared.categories.filter(c => c !== cat) } });
      };
      const confirmPlannedDone = (plannedId, date, paymentMethod) => {
        const planned = (data.plannedExpenses || []).find(p => p.id === plannedId);
        if (!planned) return;
        const newExpense = {
          id: Date.now().toString() + Math.random(),
          supplier: planned.supplier, amount: planned.amount, category: planned.category,
          paymentMethod, date, note: planned.note,
        };
        save({
          ...data,
          expenses: [...data.expenses, newExpense],
          plannedExpenses: (data.plannedExpenses || []).filter(p => p.id !== plannedId),
        });
      };
      const togglePaidFixed = (fixedId, mk) => {
        const paid = data.paidFixed?.[mk] || [];
        const newPaid = paid.includes(fixedId) ? paid.filter(id => id !== fixedId) : [...paid, fixedId];
        save({ ...data, paidFixed: { ...data.paidFixed, [mk]: newPaid } });
      };

      const now = new Date();
      const currentMonthKey = getMonthKey(now);
      const displayedMonthExpenses = data.expenses.filter(e => e.date.startsWith(displayedMonthKey));
      const displayedMonthIncomes = (data.incomes || []).filter(i => i.date.startsWith(displayedMonthKey));
      const displayedMonthVariable = displayedMonthExpenses.reduce((s, e) => s + Number(e.amount), 0);
      const displayedMonthIncome = displayedMonthIncomes.reduce((s, i) => s + Number(i.amount), 0);
      const displayedMonthFixed = data.fixedExpenses.reduce((s, e) => s + Number(e.amount), 0);
      const displayedMonthInstallments = data.installments
        .filter(i => isInstallmentActiveInMonth(i, displayedMonthKey))
        .reduce((s, i) => s + Number(i.amount), 0);
      // Planned expenses: show in displayedMonth if estimatedDate matches OR (displayed is current AND date is empty)
      const displayedMonthPlanned = (data.plannedExpenses || []).filter(p => {
        if (p.estimatedDate) return p.estimatedDate.startsWith(displayedMonthKey);
        return displayedMonthKey === currentMonthKey;
      });
      const displayedMonthPlannedTotal = displayedMonthPlanned.reduce((s, p) => s + Number(p.amount), 0);
      const displayedMonthTotalSpent = displayedMonthVariable + displayedMonthFixed + displayedMonthInstallments;
      const displayedMonthBalance = data.budget - displayedMonthTotalSpent + displayedMonthIncome;
      const displayedMonthProjectedBalance = displayedMonthBalance - displayedMonthPlannedTotal;

      if (!loaded) return <div className="min-h-screen flex items-center justify-center text-blue-700">טוען...</div>;

      const closeModal = () => { setShowAddModal(false); setEditingExpense(null); setEditingIncome(null); setEditingPlanned(null); setEditingSharedExpense(null); };

      const goToPrevMonth = () => {
        const [y, m] = displayedMonthKey.split('-').map(Number);
        const d = new Date(y, m - 2, 1);
        setDisplayedMonthKey(getMonthKey(d));
      };
      const goToNextMonth = () => {
        const [y, m] = displayedMonthKey.split('-').map(Number);
        const d = new Date(y, m, 1);
        setDisplayedMonthKey(getMonthKey(d));
      };
      const goToCurrentMonth = () => setDisplayedMonthKey(currentMonthKey);
      const switchSpace = (newSpace) => { setSpace(newSpace); setView('home'); goToCurrentMonth(); };

      const sharedData = data.shared || { annualBudget: DEFAULT_ANNUAL_BUDGET, categories: DEFAULT_SHARED_CATEGORIES, expenses: [] };
      const isShared = space === 'shared';

      return (
        <div dir="rtl" className="min-h-screen pb-24">
          <div className="sticky top-0 z-30 bg-white/70 backdrop-blur-md border-b border-slate-200/60">
            <div className="max-w-2xl mx-auto px-4 py-2.5">
              <div className="grid grid-cols-2 gap-1 bg-slate-100/80 rounded-full p-1">
                <button onClick={() => switchSpace('personal')}
                  className={`flex items-center justify-center gap-1.5 py-2 rounded-full text-sm font-medium transition-all ${!isShared ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500'}`}>
                  <User className="w-3.5 h-3.5" />
                  <span>אישי</span>
                </button>
                <button onClick={() => switchSpace('shared')}
                  className={`flex items-center justify-center gap-1.5 py-2 rounded-full text-sm font-medium transition-all ${isShared ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>
                  <Users className="w-3.5 h-3.5" />
                  <span>משותף</span>
                </button>
              </div>
            </div>
          </div>

          <div className="max-w-2xl mx-auto px-4 py-6">
            {!isShared && view === 'home' && <HomeView data={data}
              displayedMonthKey={displayedMonthKey} currentMonthKey={currentMonthKey}
              balance={displayedMonthBalance} totalSpent={displayedMonthTotalSpent}
              monthlyIncome={displayedMonthIncome} plannedTotal={displayedMonthPlannedTotal}
              projectedBalance={displayedMonthProjectedBalance}
              displayedMonthExpenses={displayedMonthExpenses} displayedMonthIncomes={displayedMonthIncomes}
              displayedMonthPlanned={displayedMonthPlanned}
              onPrevMonth={goToPrevMonth} onNextMonth={goToNextMonth} onCurrentMonth={goToCurrentMonth}
              onEdit={(e) => { setEditingExpense(e); setEditingIncome(null); setEditingPlanned(null); setShowAddModal(true); }}
              onEditIncome={(i) => { setEditingIncome(i); setEditingExpense(null); setEditingPlanned(null); setShowAddModal(true); }}
              onEditPlanned={(p) => { setEditingPlanned(p); setEditingExpense(null); setEditingIncome(null); setShowAddModal(true); }}
              onDelete={deleteExpense} onDeleteIncome={deleteIncome} onDeletePlanned={deletePlanned}
              onConfirmPlanned={(p) => setConfirmingPlanned(p)}
              onTogglePaid={togglePaidFixed} />}
            {!isShared && view === 'stats' && <StatsView data={data} />}
            {!isShared && view === 'settings' && <SettingsView data={data} save={save} />}

            {isShared && view === 'home' && <SharedHomeView data={data} sharedData={sharedData}
              displayedMonthKey={displayedMonthKey} currentMonthKey={currentMonthKey}
              onPrevMonth={goToPrevMonth} onNextMonth={goToNextMonth} onCurrentMonth={goToCurrentMonth}
              onEdit={(e) => { setEditingSharedExpense(e); setShowAddModal(true); }}
              onDelete={deleteSharedExpense} />}
            {isShared && view === 'stats' && <SharedStatsView data={data} sharedData={sharedData} />}
            {isShared && view === 'settings' && <SharedSettingsView sharedData={sharedData}
              onUpdateBudget={updateSharedBudget} onAddCategory={addSharedCategory} onRemoveCategory={removeSharedCategory} />}
          </div>

          <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-blue-100/70 shadow-lg">
            <div className="max-w-2xl mx-auto flex items-center justify-around py-2 px-4">
              <NavButton icon={<Home className="w-5 h-5" />} label="בית" active={view === 'home'} onClick={() => { setView('home'); goToCurrentMonth(); }} />
              <NavButton icon={<BarChart3 className="w-5 h-5" />} label="נתונים" active={view === 'stats'} onClick={() => setView('stats')} />
              <button onClick={() => { setEditingExpense(null); setEditingIncome(null); setEditingPlanned(null); setEditingSharedExpense(null); setShowAddModal(true); }}
                className={`flex items-center justify-center w-11 h-11 rounded-full text-white shadow-md active:scale-95 transition-all ${isShared ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-blue-600 hover:bg-blue-700'}`} aria-label="הוסף פעולה">
                <Plus className="w-5 h-5" strokeWidth={2.5} />
              </button>
              <NavButton icon={<Settings className="w-5 h-5" />} label="הגדרות" active={view === 'settings'} onClick={() => setView('settings')} />
            </div>
          </nav>

          {showAddModal && !isShared && (
            <TransactionModal categories={data.categories} expense={editingExpense} income={editingIncome} planned={editingPlanned}
              onSaveExpense={(exp) => { editingExpense ? updateExpense(editingExpense.id, exp) : addExpense(exp); closeModal(); }}
              onSaveIncome={(inc) => { editingIncome ? updateIncome(editingIncome.id, inc) : addIncome(inc); closeModal(); }}
              onSavePlanned={(p) => { editingPlanned ? updatePlanned(editingPlanned.id, p) : addPlanned(p); closeModal(); }}
              onClose={closeModal} />
          )}

          {showAddModal && isShared && (
            <SharedExpenseModal categories={sharedData.categories} expense={editingSharedExpense}
              onSave={(exp) => { editingSharedExpense ? updateSharedExpense(editingSharedExpense.id, exp) : addSharedExpense(exp); closeModal(); }}
              onClose={closeModal} />
          )}

          {confirmingPlanned && (
            <ConfirmPlannedDoneModal planned={confirmingPlanned}
              onConfirm={(date, paymentMethod) => { confirmPlannedDone(confirmingPlanned.id, date, paymentMethod); setConfirmingPlanned(null); }}
              onClose={() => setConfirmingPlanned(null)} />
          )}
        </div>
      );
    }

    function NavButton({ icon, label, active, onClick }) {
      return (
        <button onClick={onClick} className={`flex flex-col items-center gap-0.5 px-4 py-2 rounded-xl transition-colors ${active ? 'text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>
          {icon}<span className="text-xs font-medium">{label}</span>
        </button>
      );
    }

    function HomeView({ data, displayedMonthKey, currentMonthKey, balance, totalSpent, monthlyIncome, plannedTotal, projectedBalance,
                         displayedMonthExpenses, displayedMonthIncomes, displayedMonthPlanned,
                         onPrevMonth, onNextMonth, onCurrentMonth,
                         onEdit, onEditIncome, onEditPlanned, onDelete, onDeleteIncome, onDeletePlanned, onConfirmPlanned, onTogglePaid }) {
      const balancePositive = balance >= 0;
      const isCurrent = displayedMonthKey === currentMonthKey;
      const [year, monthNum] = displayedMonthKey.split('-').map(Number);
      const monthName = hebrewMonths[monthNum - 1];
      const isFuture = displayedMonthKey > currentMonthKey;
      const isPast = displayedMonthKey < currentMonthKey;
      const progressPercent = Math.min((totalSpent / data.budget) * 100, 100);
      const paidThisMonth = data.paidFixed?.[displayedMonthKey] || [];

      // Swipe gesture handling
      const touchStart = React.useRef(null);
      const handleTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
      const handleTouchEnd = (e) => {
        if (touchStart.current === null) return;
        const diff = e.changedTouches[0].clientX - touchStart.current;
        if (Math.abs(diff) > 60) {
          // RTL: swipe right (positive diff) goes to next month, swipe left to previous
          if (diff > 0) onNextMonth(); else onPrevMonth();
        }
        touchStart.current = null;
      };

      const fixedItems = data.fixedExpenses.map(f => ({
        id: 'fixed-' + f.id, fixedId: f.id, supplier: f.name, amount: f.amount, category: f.category,
        paymentMethod: f.paymentMethod || 'credit', date: displayedMonthKey + '-01', note: f.note,
        isFixed: true, requiresConfirmation: f.requiresConfirmation, shared: f.shared,
        isPaid: !f.requiresConfirmation || paidThisMonth.includes(f.id),
      }));

      const activeInstallments = data.installments.filter(i => isInstallmentActiveInMonth(i, displayedMonthKey)).map(i => ({
        id: 'installment-' + i.id, supplier: i.name, amount: i.amount, category: i.category,
        paymentMethod: 'credit', date: displayedMonthKey + '-01', note: i.note, isInstallment: true, shared: i.shared,
        installmentNumber: getInstallmentNumber(i, displayedMonthKey), totalPayments: i.totalPayments,
      }));

      const incomeItems = (displayedMonthIncomes || []).map(inc => ({
        id: 'income-' + inc.id, incomeId: inc.id, supplier: inc.description, amount: inc.amount,
        date: inc.date, isIncome: true,
      }));

      const plannedItems = (displayedMonthPlanned || []).map(p => ({
        id: 'planned-' + p.id, plannedId: p.id, supplier: p.supplier, amount: p.amount, category: p.category,
        date: p.estimatedDate || (displayedMonthKey + '-01'), note: p.note, isPlanned: true,
        rawPlanned: p,
      }));

      const allMonth = [...displayedMonthExpenses, ...fixedItems, ...activeInstallments, ...incomeItems, ...plannedItems].sort((a, b) => b.date.localeCompare(a.date));

      const bigNumber = isCurrent ? balance : projectedBalance;
      const bigNumberLabel = isCurrent ? 'יתרה לחודש' : isFuture ? 'יתרה צפויה לחודש' : 'יתרה בסוף החודש';

      return (
        <>
          <div className="text-center mb-4">
            <h1 className="text-3xl font-bold text-slate-800 mb-2">מעקב הוצאות</h1>
            <div className="inline-flex items-center gap-1 bg-white/60 backdrop-blur rounded-full px-1 py-1 border border-slate-200/50">
              <button onClick={onPrevMonth} className="p-1.5 hover:bg-slate-100 rounded-full text-slate-600" aria-label="חודש קודם"><ChevronRight className="w-4 h-4" /></button>
              <span className="text-sm font-medium text-slate-700 min-w-[110px] text-center">{monthName} {year}</span>
              <button onClick={onNextMonth} className="p-1.5 hover:bg-slate-100 rounded-full text-slate-600" aria-label="חודש הבא"><ChevronLeft className="w-4 h-4" /></button>
            </div>
            {!isCurrent && (
              <div className="mt-2">
                <button onClick={onCurrentMonth} className="text-xs text-blue-600 hover:text-blue-800 font-medium">חזרה לחודש הנוכחי ←</button>
              </div>
            )}
          </div>

          <div onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
            <div className={`rounded-3xl p-6 text-white shadow-xl mb-6 ${isFuture ? 'opacity-95' : ''}`} style={{ background: isFuture ? 'linear-gradient(135deg, #475569 0%, #334155 100%)' : isPast ? 'linear-gradient(135deg, #64748b 0%, #475569 100%)' : 'linear-gradient(135deg, #2563eb 0%, #4f46e5 100%)' }}>
              <p className="text-sm mb-1 opacity-80">{bigNumberLabel}</p>
              <div className="flex items-baseline gap-2 mb-3 flex-wrap">
                <span className={`text-4xl font-bold ${(isCurrent ? balancePositive : projectedBalance >= 0) ? '' : 'text-rose-100'}`}>{formatCurrency(bigNumber)}</span>
                {isCurrent && !balancePositive && <span className="text-rose-100 text-sm font-medium">חריגה מהתקציב</span>}
                {isFuture && <span className="text-xs font-medium opacity-80 bg-white/15 px-2 py-0.5 rounded-full">צפי</span>}
              </div>
              <div className="space-y-1 mb-2">
                <div className="flex items-center justify-between text-xs opacity-85">
                  <span>הוצאת</span>
                  <span className="font-medium">{formatCurrency(totalSpent)} מתוך {formatCurrency(data.budget)}</span>
                </div>
                {monthlyIncome > 0 && (
                  <div className="flex items-center justify-between text-xs text-emerald-200">
                    <span className="flex items-center gap-1"><TrendingUp className="w-3 h-3" />נכנס החודש</span>
                    <span className="font-medium">+{formatCurrency(monthlyIncome)}</span>
                  </div>
                )}
                {plannedTotal > 0 && (
                  <div className="flex items-center justify-between text-xs opacity-85 pt-1 border-t border-white/20">
                    <span>צפויה לי</span>
                    <span className="font-medium">{formatCurrency(plannedTotal)}</span>
                  </div>
                )}
                {plannedTotal > 0 && isCurrent && (
                  <div className="flex items-center justify-between text-sm pt-1">
                    <span className="font-medium">יתרה צפויה בסוף החודש</span>
                    <span className={`font-bold ${projectedBalance >= 0 ? '' : 'text-rose-100'}`}>{formatCurrency(projectedBalance)}</span>
                  </div>
                )}
              </div>
              <div className="w-full h-2 bg-black/20 rounded-full overflow-hidden mt-2">
                <div className={`h-full transition-all ${(isCurrent ? balancePositive : true) ? 'bg-white' : 'bg-rose-300'}`} style={{ width: `${progressPercent}%` }} />
              </div>
            </div>

            <div className="bg-white/80 backdrop-blur rounded-3xl p-5 shadow-sm border border-slate-200/50">
              <h2 className="text-lg font-bold text-slate-800 mb-3">פעולות {isCurrent ? 'החודש' : `ב${monthName}`}</h2>
              {allMonth.length === 0 ? (
                <p className="text-center text-slate-400 py-8">אין פעולות בחודש זה</p>
              ) : (
                <div className="space-y-2">
                  {allMonth.map(exp => (
                    <ExpenseRow key={exp.id} expense={exp}
                      onEdit={exp.isIncome ? () => onEditIncome({ id: exp.incomeId, amount: exp.amount, description: exp.supplier, date: exp.date })
                        : exp.isPlanned ? () => onEditPlanned(exp.rawPlanned)
                        : (exp.isFixed || exp.isInstallment) ? null : () => onEdit(exp)}
                      onDelete={exp.isIncome ? () => onDeleteIncome(exp.incomeId)
                        : exp.isPlanned ? () => onDeletePlanned(exp.plannedId)
                        : (exp.isFixed || exp.isInstallment) ? null : () => onDelete(exp.id)}
                      onConfirmPlanned={exp.isPlanned ? () => onConfirmPlanned(exp.rawPlanned) : null}
                      onTogglePaid={exp.isFixed && exp.requiresConfirmation ? () => onTogglePaid(exp.fixedId, displayedMonthKey) : null} />
                  ))}
                </div>
              )}
            </div>
          </div>
        </>
      );
    }

    function ExpenseRow({ expense, onEdit, onDelete, onTogglePaid, onConfirmPlanned }) {
      const date = new Date(expense.date);
      const dayMonth = `${date.getDate()}/${date.getMonth() + 1}`;
      const PaymentIcon = expense.paymentMethod === 'cash' ? Wallet : CreditCard;
      const isPending = expense.isFixed && expense.requiresConfirmation && !expense.isPaid;
      const isIncome = expense.isIncome;
      const isPlanned = expense.isPlanned;

      const containerClasses = isPlanned
        ? 'bg-slate-100/70 hover:bg-slate-100 border-2 border-dashed border-slate-300'
        : isIncome
          ? 'bg-emerald-50/70 hover:bg-emerald-50 border border-emerald-100'
          : isPending
            ? 'bg-slate-100/60 border border-dashed border-slate-300 hover:bg-slate-100'
            : 'bg-slate-50 hover:bg-slate-100';

      const inner = (
        <div className={`flex items-center gap-3 p-3 rounded-xl transition-colors group ${containerClasses}`}>
          {isPlanned ? (
            <div className="bg-slate-200 text-slate-500 p-2 rounded-full"><Calendar className="w-4 h-4" /></div>
          ) : isIncome ? (
            <div className="bg-emerald-100 text-emerald-600 p-2 rounded-full"><TrendingUp className="w-4 h-4" strokeWidth={2.5} /></div>
          ) : isPending ? (
            <div className="bg-white border-2 border-slate-300 p-1.5 rounded-full"><Circle className="w-4 h-4 text-slate-300" /></div>
          ) : expense.isFixed && expense.requiresConfirmation && expense.isPaid ? (
            <div className="bg-emerald-100 text-emerald-600 p-2 rounded-full"><Check className="w-4 h-4" strokeWidth={3} /></div>
          ) : expense.isInstallment ? (
            <div className="bg-purple-100 text-purple-600 p-2 rounded-full"><Repeat className="w-4 h-4" /></div>
          ) : expense.isFixed ? (
            <div className="bg-indigo-100 text-indigo-600 p-2 rounded-full"><PaymentIcon className="w-4 h-4" /></div>
          ) : (
            <div className="bg-blue-100 text-blue-600 p-2 rounded-full"><PaymentIcon className="w-4 h-4" /></div>
          )}
          <div className="flex-1 min-w-0">
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 min-w-0 flex-wrap">
                <span className={`font-medium truncate ${isPlanned ? 'text-slate-600' : isIncome ? 'text-emerald-800' : isPending ? 'text-slate-500' : 'text-slate-800'}`}>{expense.supplier}</span>
                {isPlanned && (
                  <span className="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded-full flex-shrink-0">צפויה</span>
                )}
                {isIncome && (
                  <span className="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-full flex-shrink-0">הכנסה</span>
                )}
                {expense.isFixed && (
                  <span className={`text-[10px] px-1.5 py-0.5 rounded-full flex-shrink-0 ${isPending ? 'bg-slate-200 text-slate-500' : 'bg-indigo-100 text-indigo-700'}`}>
                    {isPending ? 'ממתין לתשלום' : 'קבועה'}
                  </span>
                )}
                {expense.isInstallment && (
                  <span className="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded-full flex-shrink-0">תשלום {expense.installmentNumber}/{expense.totalPayments}</span>
                )}
                {expense.shared && (
                  <span className="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-full flex-shrink-0 flex items-center gap-0.5">
                    <Link2 className="w-2.5 h-2.5" />
                    משותף
                  </span>
                )}
              </div>
              <span className={`font-bold flex-shrink-0 ${isPlanned ? 'text-slate-600' : isIncome ? 'text-emerald-700' : isPending ? 'text-slate-400' : 'text-slate-700'}`}>
                {isIncome ? '+' : ''}{formatCurrency(Number(expense.amount))}
              </span>
            </div>
            <div className={`flex items-center justify-between text-xs ${isPlanned ? 'text-slate-500' : isIncome ? 'text-emerald-700/70' : 'text-slate-500'}`}>
              <span>{isIncome ? dayMonth : isPlanned ? (expense.category + (expense.rawPlanned?.estimatedDate ? ` · ${dayMonth}` : ' · ללא תאריך')) : `${expense.category}${!expense.isFixed && !expense.isInstallment ? ` · ${dayMonth}` : ''}`}</span>
              <div className="flex items-center gap-1">
                {isPlanned && onConfirmPlanned && (
                  <button onClick={(e) => { e.stopPropagation(); onConfirmPlanned(); }}
                    className="flex items-center gap-1 text-[11px] bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-1 rounded-full font-medium">
                    <Check className="w-3 h-3" strokeWidth={3} /> בוצע
                  </button>
                )}
                {(onEdit || onDelete) && (
                  <div className="flex items-center gap-1 opacity-60 group-hover:opacity-100 transition-opacity">
                    {onEdit && <button onClick={(e) => { e.stopPropagation(); onEdit(); }} className={`p-1 ${isIncome ? 'text-emerald-500 hover:text-emerald-700' : 'text-slate-400 hover:text-blue-600'}`}><Edit2 className="w-3.5 h-3.5" /></button>}
                    {onDelete && <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="text-slate-400 hover:text-rose-600 p-1"><Trash2 className="w-3.5 h-3.5" /></button>}
                  </div>
                )}
              </div>
            </div>
            {expense.note && (
              <div className="flex items-start gap-1 mt-1 text-xs text-slate-500 italic">
                <MessageSquare className="w-3 h-3 flex-shrink-0 mt-0.5 opacity-60" />
                <span className="break-words">{expense.note}</span>
              </div>
            )}
          </div>
        </div>
      );

      if (onTogglePaid) return <button onClick={onTogglePaid} className="w-full text-right">{inner}</button>;
      return inner;
    }

    function TransactionModal({ categories, expense, income, planned, onSaveExpense, onSaveIncome, onSavePlanned, onClose }) {
      const isEditing = !!(expense || income || planned);
      const initialType = income ? 'income' : 'expense';
      const [type, setType] = useState(initialType);
      const [isPlanned, setIsPlanned] = useState(!!planned);

      // Expense / planned shared fields
      const initialFromSource = expense || planned || null;
      const [supplier, setSupplier] = useState(initialFromSource?.supplier || '');
      const [amount, setAmount] = useState(initialFromSource?.amount || '');
      const [category, setCategory] = useState(initialFromSource?.category || categories[0] || '');
      const [paymentMethod, setPaymentMethod] = useState(expense?.paymentMethod || 'credit');
      const [date, setDate] = useState(expense?.date || planned?.estimatedDate || formatDate(new Date()));
      const [note, setNote] = useState(initialFromSource?.note || '');
      const [isShared, setIsShared] = useState(!!expense?.shared);

      // Income fields
      const [incomeAmount, setIncomeAmount] = useState(income?.amount || '');
      const [incomeDescription, setIncomeDescription] = useState(income?.description || '');
      const [incomeDate, setIncomeDate] = useState(income?.date || formatDate(new Date()));

      const canSaveExpense = supplier.trim() && Number(amount) > 0 && category;
      const canSaveIncome = incomeDescription.trim() && Number(incomeAmount) > 0;

      const handleSave = () => {
        if (type === 'income') {
          if (!canSaveIncome) return;
          onSaveIncome({ amount: Number(incomeAmount), description: incomeDescription.trim(), date: incomeDate });
          return;
        }
        if (!canSaveExpense) return;
        if (isPlanned) {
          onSavePlanned({
            supplier: supplier.trim(), amount: Number(amount), category,
            estimatedDate: date || undefined, note: note.trim() || undefined,
          });
        } else {
          onSaveExpense({ supplier: supplier.trim(), amount: Number(amount), category, paymentMethod, date, note: note.trim() || undefined, shared: isShared || undefined });
        }
      };

      const title = isEditing
        ? (planned ? 'עריכת הוצאה מתוכננת' : type === 'expense' ? 'עריכת הוצאה' : 'עריכת הכנסה')
        : 'פעולה חדשה';

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div dir="rtl" className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-5">
              <h3 className="text-xl font-bold text-slate-800">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1"><X className="w-5 h-5" /></button>
            </div>

            {!isEditing && (
              <div className="grid grid-cols-2 gap-1 bg-slate-100 rounded-2xl p-1 mb-5">
                <button onClick={() => setType('expense')}
                  className={`py-2.5 rounded-xl text-sm font-medium transition-all ${type === 'expense' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500'}`}>
                  הוצאה
                </button>
                <button onClick={() => setType('income')}
                  className={`flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-sm font-medium transition-all ${type === 'income' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500'}`}>
                  <TrendingUp className="w-3.5 h-3.5" />
                  הכנסה
                </button>
              </div>
            )}

            {type === 'expense' ? (
              <div className="space-y-4">
                {(!isEditing || planned) && (
                  <button type="button" onClick={() => !planned && setIsPlanned(!isPlanned)}
                    className={`w-full flex items-start gap-2.5 p-3 rounded-xl border text-right transition-colors ${isPlanned ? 'bg-slate-100 border-slate-400' : 'bg-white border-slate-200 hover:bg-slate-50'} ${planned ? 'opacity-100 cursor-default' : ''}`}>
                    <div className={`flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center mt-0.5 ${isPlanned ? 'bg-slate-600 border-slate-600' : 'bg-white border-slate-300'}`}>
                      {isPlanned && <Check className="w-3 h-3 text-white" strokeWidth={3} />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className={`text-sm font-medium ${isPlanned ? 'text-slate-800' : 'text-slate-700'}`}>זו הוצאה מתוכננת (עוד לא בוצעה)</div>
                      <div className="text-[11px] text-slate-500 leading-relaxed">תופיע ברשימה באפור עם כפתור ״בוצע״ כשתקרה</div>
                    </div>
                  </button>
                )}

                <Field label={isPlanned ? 'שם / הסבר' : 'ספק'}>
                  <input type="text" value={supplier} onChange={(e) => setSupplier(e.target.value)} placeholder={isPlanned ? 'טיפול לאוטו, כסף זר לחו"ל...' : 'אמזון, סופר פארם...'}
                    className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 text-slate-800" />
                </Field>
                <Field label="סכום">
                  <div className="relative">
                    <input type="number" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0"
                      className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 text-slate-800 pl-12" />
                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">₪</span>
                  </div>
                </Field>
                <Field label="קטגוריה">
